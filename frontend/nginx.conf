server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' http://localhost:8080; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    location ~ ^/(api/|health/|mcp$|\.well-known/|metrics$) {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
