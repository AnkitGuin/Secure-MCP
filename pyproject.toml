[project]
name = "securemcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0", "fastapi>=0.128,<1", "uvicorn>=0.40,<1",
  "sqlalchemy[asyncio]>=2.0.48,<2.1", "alembic>=1.18,<2",
  "asyncpg>=0.31,<1", "aiosqlite>=0.22,<1", "redis>=7,<9",
  "PyJWT[crypto]>=2.12,<3", "httpx>=0.28,<1", "httpx2==2.16.0", "idna>=3.20,<4", "pydantic-settings>=2.12,<3",
  "jsonschema>=4.26,<5", "prometheus-client>=0.24,<1", "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2"
]
[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "hypothesis>=6,<7", "ruff>=0.15,<1", "mypy>=1.19,<3", "pip-audit>=2.10,<3"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
